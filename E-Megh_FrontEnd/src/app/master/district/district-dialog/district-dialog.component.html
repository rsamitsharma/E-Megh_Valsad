<h1 mat-dialog-title class="--primary-heading --mat-dialog">District Master {{ !IsEdit ? "Entry" : "Update" }}</h1>

<div mat-dialog-content>
  <div class="row" [ngClass]="{ 'col-12 mb-2': !IsEdit }">
    <div Class="col col-12 mb-2" *ngIf="IsEdit">
      <div class="--input-group">
        <input InputField Asterisk autocomplete="off" type="text" [(ngModel)]="DistrictID" [disabled]="true" />
        <label Asterisk>DistrictID</label>
      </div>
    </div>

    <div Class="  col-12 mb-2">
      <div class="--input-group">
        <input InputField Asterisk autocomplete="off" type="text" [(ngModel)]="DistrictName" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>District Name</label>
      </div>
    </div>

    <div Class="  col-12 mb-2">
      <input-select inputLabel="Select State" placeholder="---Select State---" [(selectedValue)]="StateID" [isRequired]="true" [isSearch]="false" [masterList]="StateList"> </input-select>
    </div>
  </div>
</div>

<mat-dialog-actions align="end" [ngClass]="{ 'd-flex justify-content-between': IsEdit }">
  <div *ngIf="IsEdit">
    <section class="form-group example-section">
      <mat-checkbox name="IsActive" [(ngModel)]="IsActive" class="example-margin" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit">IsActive </mat-checkbox>
    </section>
  </div>
  <div>
    <button type="button" matRipple class="--btn-outlined-gray m-1" [mat-dialog-close]="false">Close</button>
    <ng-container *ngIf="_GlobalService.rightsControl.canEdit || !IsEdit">
      <button type="button" matRipple class="--btn-outlined-green m-1" (click)="Submit()">{{ !IsEdit ? "Submit" : "Update" }}</button>
    </ng-container>
  </div>
</mat-dialog-actions>
