<h1 mat-dialog-title class="--primary-heading --mat-dialog">Contact Master {{ !IsEdit ? "Entry" : "Update" }}</h1>
<div mat-dialog-content>
  <div class="row">
    <div class="col-12 mb-2" *ngIf="IsEdit">
      <!-- <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="ContactID" [disabled]="true" />
        <label Asterisk>ContactID</label>
      </div> -->
    </div>
    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="ContactName" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Contact Name</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="Designation" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Designation</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="number" min="0" maxlength="10" oninput="this.value=this.value.slice(0,10)" [(ngModel)]="Mobile" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label>Mobile</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="Email" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label>Email</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <input-select inputLabel="Select Village" placeholder="---Select Village---" [(selectedValue)]="VillageID" [isSearch]="true" [masterList]="VillageList"> </input-select>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <textarea InputField autocomplete="off" type="text" [(ngModel)]="Remarks" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit"></textarea>
        <label>Remarks</label>
      </div>
    </div>
  </div>
</div>

<mat-dialog-actions align="end" [ngClass]="{ 'd-flex justify-content-between': IsEdit }">
  <div *ngIf="IsEdit">
    <section class="form-group example-section">
      <mat-checkbox name="IsActive" [(ngModel)]="IsActive" class="example-margin" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit">IsActive </mat-checkbox>
    </section>
  </div>
  <div>
    <button type="button" matRipple class="--btn-outlined-gray m-1" [mat-dialog-close]="false">Close</button>
    <ng-container *ngIf="_GlobalService.rightsControl.canEdit || !IsEdit">
      <button type="button" matRipple class="--btn-outlined-green m-1" (click)="Submit()">{{ !IsEdit ? "Submit" : "Update" }}</button>
    </ng-container>
  </div>
</mat-dialog-actions>
