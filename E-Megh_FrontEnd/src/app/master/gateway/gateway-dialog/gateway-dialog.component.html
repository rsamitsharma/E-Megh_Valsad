<h1 mat-dialog-title class="--primary-heading --mat-dialog">Gateway Master {{ !IsEdit ? "Entry" : "Update" }}</h1>
<div mat-dialog-content>
  <div class="row">
    <div class="col-12 mb-2" *ngIf="IsEdit">
      <!-- <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="GatewayMasterID" [disabled]="true" />
        <label Asterisk>Gateway MasterID</label>
      </div> -->
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="GatewayName" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Name</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="CompanyName" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Company Name</label>
      </div>
    </div>

    <!-- <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="GatewayIMEI" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Gateway IMEI</label>
      </div>
    </div> -->

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="Type" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Type</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="Warrenty" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Warrenty</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="date" [(ngModel)]="PurchasedDate" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Purchased Date</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="InvoiceNo" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>InvoiceNo</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <textarea InputField autocomplete="off" type="text" [(ngModel)]="Comments" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit"></textarea>
        <label>Comments</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <textarea InputField autocomplete="off" type="text" [(ngModel)]="Remarks" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit"></textarea>
        <label>Remarks</label>
      </div>
    </div>
  </div>
</div>

<mat-dialog-actions align="end" [ngClass]="{ 'd-flex justify-content-between': IsEdit }">
  <div *ngIf="IsEdit">
    <section class="form-group example-section">
      <mat-checkbox name="IsActive" [(ngModel)]="IsActive" class="example-margin" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit">IsActive </mat-checkbox>
    </section>
  </div>
  <div>
    <button type="button" matRipple class="--btn-outlined-gray m-1" [mat-dialog-close]="false">Close</button>
    <ng-container *ngIf="_GlobalService.rightsControl.canEdit || !IsEdit">
      <button type="button" matRipple class="--btn-outlined-green m-1" (click)="Submit()">{{ !IsEdit ? "Submit" : "Update" }}</button>
    </ng-container>
  </div>
</mat-dialog-actions>
