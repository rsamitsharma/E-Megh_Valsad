<h1 mat-dialog-title class="--primary-heading --mat-dialog">RefreshTimes Master {{ !IsEdit ? "Entry" : "Update" }}</h1>
<div mat-dialog-content>
  <div class="row">
    <div class="col-12 mb-2" *ngIf="IsEdit">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="GatewaynDeviceClubMasterID" [disabled]="true" />
        <label Asterisk>Gateway ClubID</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="GatewaynDeviceClubName" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Name</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <input-select inputLabel="Select Device" placeholder="---Select Device---" [(selectedValue)]="DeviceMasterID" [isRequired]="true" [isSearch]="true" [masterList]="DeviceMasterList"> </input-select>
    </div>

    <div class="col-12 mb-2">
      <input-select inputLabel="Select Gateway" placeholder="---Select Gateway---" [(selectedValue)]="GatewayMasterID" [isRequired]="true" [isSearch]="true" [masterList]="GatewayMasterList"> </input-select>
    </div>

    <div class="col-12 mb-2">
      <input-select inputLabel="Select SIM" placeholder="---Select Sim---" [(selectedValue)]="SIMID" [isRequired]="true" [isSearch]="true" [masterList]="SimList"> </input-select>
    </div>
  </div>
</div>

<mat-dialog-actions align="end" [ngClass]="{ 'd-flex justify-content-between': IsEdit }">
  <div *ngIf="IsEdit">
    <section class="form-group example-section">
      <mat-checkbox name="IsActive" [(ngModel)]="IsActive" class="example-margin" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit">IsActive </mat-checkbox>
    </section>
  </div>
  <div>
    <button type="button" matRipple class="--btn-outlined-gray m-1" [mat-dialog-close]="false">Close</button>
    <ng-container *ngIf="_GlobalService.rightsControl.canEdit || !IsEdit">
      <button type="button" matRipple class="--btn-outlined-green m-1" (click)="Submit()">{{ !IsEdit ? "Submit" : "Update" }}</button>
    </ng-container>
  </div>
</mat-dialog-actions>
