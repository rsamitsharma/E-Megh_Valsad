<h1 mat-dialog-title class="--primary-heading --mat-dialog">Gateway Siren Data {{ !IsEdit ? "Entry" : "Update" }}</h1>

<div mat-dialog-content>
  <div class="row">
    <div class="col-12 mb-2" *ngIf="IsEdit">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="GatewaySirenDataID" [disabled]="true" />
        <label Asterisk>Gateway SirenDataID</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="date" [(ngModel)]="RDatetime" [max]="currentdate" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Date</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <input-select inputLabel="Select Siren Location" [(selectedValue)]="SirenLocationID" [isRequired]="true" [isSearch]="false" [masterList]="SirenLocationList"> </input-select>
    </div>

    <div class="col-12 mb-2">
      <input-select inputLabel="Select Gateway IMEI" [(selectedValue)]="GatewayIMEI" [isRequired]="true" [isSearch]="false" [masterList]="GatewayIMEIList"> </input-select>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="CurrentIP" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Current IP</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" min="0" type="number" OnlyNumber [(ngModel)]="BetteryLevel" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Battery Level</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" min="0" type="number" OnlyNumber [(ngModel)]="SingleLevel" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Single Level</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" min="0" type="number" OnlyNumber [(ngModel)]="PowerLevel" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Power Level</label>
      </div>
    </div>

    <div class="col-12 mb-2 mt-3">
      <mat-checkbox name="IsPowerOn" [(ngModel)]="IsPowerOn" class="example-margin" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit">IsPowerOn </mat-checkbox>
    </div>
  </div>
</div>

<mat-dialog-actions align="end">
  <button type="button" matRipple class="--btn-outlined-gray m-1" mat-dialog-close #CloseDialog>Close</button>
  <ng-container *ngIf="_GlobalService.rightsControl.canEdit || !IsEdit">
    <button type="button" matRipple class="--btn-outlined-green m-1" (click)="Submit()">{{ !IsEdit ? "Submit" : "Update" }}</button>
  </ng-container>
</mat-dialog-actions>
