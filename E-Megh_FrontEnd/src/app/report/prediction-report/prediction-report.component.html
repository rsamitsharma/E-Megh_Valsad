<div class="row m-0 p-0">
  <div class="col-12 m-4 d-flex">
    <div class="col-6">
      <h3 class="--heading-josefin"><b>WaterLevel Prediction</b></h3>
    </div>
    <div class="col-6" align="end">
      <!-- <button class="--btn-outlined-green" (click)="downloadPDF()">Download PDF</button> -->
      <button class="--btn-outlined-green" (click)="exportToExcel()">Download Excel</button>
    </div>
  </div>
  <hr />
  <div id="predictionTable">
    <div class="col-12">
      <div class="row d-flex align-items-center">
        <div class="col-lg-2 col-12">
          <div class="--input-group">
            <input InputField autocomplete="off" type="date" [(ngModel)]="StartDateTime" />
            <label Asterisk>From</label>
          </div>
        </div>

        <div class="col-lg-2 col-12">
          <div class="--input-group">
            <input InputField autocomplete="off" type="date" [(ngModel)]="EndDateTime" />
            <label Asterisk>To</label>
          </div>
        </div>

        <div class="col-lg-2 col-12 mt-4">
          <button type="button" matRipple class="--btn-outlined-green" (click)="GetPredictionReport()">Search</button>
        </div>

        <div class="col-lg-6 col-12 d-flex justify-content-end">
          <div class="--input-group --width-50">
            <input InputField autocomplete="off" type="text" (keyup)="applyFilter($event)" />
            <label>Search</label>
          </div>
        </div>
      </div>
    </div>

    <div class="col-12 p-3 w-100">
      <div class="mat-elevation-z8">
        <div class="--table-container">
          <table mat-table [dataSource]="dataSource" class="table table-striped" matSort>
            <ng-container [matColumnDef]="item.columnKey" *ngFor="let item of defaultTableColumns">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ item.headingName }}</th>
              <td mat-cell *matCellDef="let row">
                <dynamic-mat-columns *ngIf="row" [row]="row" [item]="item"></dynamic-mat-columns>
              </td>
            </ng-container>

            <ng-container matColumnDef="Action">
              <th mat-header-cell *matHeaderCellDef>
                <!-- <mat-icon class="NewBtnMatAdd" *ngIf="_GlobalService.rightsControl.canAdd" data-toggle="modal" data-backdrop="static" data-keyboard="false" data-target="#ListData" matTooltip="Add" matTooltipClass="matTooltip" (click)="openDialog()">add </mat-icon> -->
              </th>
              <td mat-cell *matCellDef="let row">
                <!-- <mat-icon class="BtnMatEditGreen" *ngIf="_GlobalService.rightsControl.canView || _GlobalService.rightsControl.canEdit" data-toggle="modal" data-backdrop="static" data-keyboard="false" data-target="#ListData" matTooltip="View or Edit" matTooltipClass="matTooltip" (click)="openDialog(row.GatewayRaingaugeDataID)">visibility </mat-icon> -->
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
        </div>
        <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
      </div>
    </div>
  </div>
</div>
