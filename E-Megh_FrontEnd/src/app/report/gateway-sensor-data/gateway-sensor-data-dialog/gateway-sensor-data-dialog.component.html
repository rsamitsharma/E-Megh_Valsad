<h1 mat-dialog-title class="--primary-heading --mat-dialog">Gateway Sensor Data {{ !IsEdit ? "Entry" : "View" }}</h1>

<div mat-dialog-content>
  <div class="row">
    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="Dialogdata.DRID" [disabled]="true" />
        <label Asterisk>Gateway Sensor Data ID</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="Dialogdata.WaterLevel" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>WaterLevel</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="Dialogdata.WaterLevel_FT" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>WaterLevel_FT</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="Dialogdata.MinWaterLevel" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>MinWaterLevel</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="Dialogdata.MaxWaterLevel" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>MaxWaterLevel</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="Dialogdata.Trend" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Trend</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="Dialogdata.DangerWaterLevel" [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>DangerWaterLevel</label>
      </div>
    </div>
