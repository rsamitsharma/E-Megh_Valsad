<div class="row m-0 p-0">
  <div class="col-12 m-4 d-flex">
    <div class="col-6">
      <h1 class="--heading-josefin"><b>Daily Reading Report</b></h1>
    </div>
    <div class="col-6" align="end">
      <button class="--btn-outlined-green" (click)="exportToExcel()">Download Excel</button>
    </div>
  </div>
  <hr />

  <div class="col-12">
    <div class="row d-flex align-items-center">
      <div class="col-lg-3 col-md-3 col-12 mb-2">
        <input-select inputLabel="Select Reading Location" [(selectedValue)]="ReadingLocationID" [isRequired]="true" [isSearch]="false" [masterList]="LocationList"> </input-select>
      </div>
      <div class="col-lg-2 col-md-2 col-12 mt-4">
        <button type="button" matRipple class="--btn-outlined-green" (click)="GetDailyReadingRecord()">Search</button>
      </div>

      <div class="col-lg-2 col-md-2 col-12">
        <!-- <div class="--input-group">
            <input InputField autocomplete="off" type="date" [(ngModel)]="FromDate" [max]="ToDate" />
            <label Asterisk>From</label>
          </div> -->
      </div>

      <div class="col-lg-2 col-md-2 col-12">
        <!-- <div class="--input-group">
            <input InputField autocomplete="off" type="date" [(ngModel)]="ToDate" [min]="FromDate" [max]="ToDate" />
            <label Asterisk>To</label>
          </div> -->
      </div>

      <div class="col-lg-3 col-md-3 col-12">
        <div class="--input-group --width-100">
          <input InputField autocomplete="off" type="text" (keyup)="applyFilter($event)" />
          <label>Search</label>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12 p-3 w-100">
    <div class="mat-elevation-z8">
      <div class="--table-container">
        <table mat-table [dataSource]="dataSource" matSort class="mat-paginator-sticky table table-striped">
          <ng-container [matColumnDef]="item.columnKey" *ngFor="let item of defaultTableColumns">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ item.headingName }}</th>
            <td mat-cell *matCellDef="let row">
              <dynamic-mat-columns *ngIf="row" [row]="row" [item]="item"></dynamic-mat-columns>
            </td>
          </ng-container>

          <ng-container matColumnDef="Action">
            <th mat-header-cell *matHeaderCellDef>
              <!-- <mat-icon class="NewBtnMatAdd" *ngIf="_GlobalService.rightsControl.canAdd" data-toggle="modal" data-backdrop="static" data-keyboard="false" data-target="#ListData" matTooltip="Click to add Menu Master" matTooltipClass="matTooltip" (click)="openDialog()">add </mat-icon> -->
            </th>
            <td mat-cell *matCellDef="let row">
              <!-- <mat-icon class="BtnMatEditGreen" *ngIf="_GlobalService.rightsControl.canView || _GlobalService.rightsControl.canEdit" data-toggle="modal" data-backdrop="static" data-keyboard="false" data-target="#ListData" matTooltip="Click to view or edit master" matTooltipClass="matTooltip" (click)="openDialog(row.DRID)">visibility </mat-icon> -->
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
</div>
