<h1 mat-dialog-title class="--primary-heading --mat-dialog">User Type Master {{ !IsEdit ? "Entry" : "Update" }}</h1>

<div mat-dialog-content>
  <div class="row" [ngClass]="{ 'col-12 mb-2': !IsEdit }">
    <div class="col-12 mb-2" *ngIf="IsEdit">
      <div class="--input-group">
        <input InputField Asterisk autocomplete="off" type="text" [(ngModel)]="UserTypeId" [disabled]="true" />
        <label Asterisk>User TypeId</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField Asterisk autocomplete="off" type="text" [(ngModel)]="UserType" />
        <label Asterisk>User Type</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField Asterisk autocomplete="off" type="number" OnlyNumber [(ngModel)]="MunID" />
        <label Asterisk>MunID</label>
      </div>
    </div>
  </div>
</div>

<mat-dialog-actions align="end">
  <ng-container>
    <button type="button" matRipple class="--btn-outlined-gray m-1" mat-dialog-close #CloseDialog>Close</button>
    <button type="button" matRipple class="--btn-outlined-green m-1" (click)="Submit()">{{ !IsEdit ? "Submit" : "Update" }}</button>
  </ng-container>
</mat-dialog-actions>
