<div class="row m-0 p-0">
  <div class="col-12 m-4">
    <h1 class="--heading-josefin"><b>User Type Permissiom Master</b></h1>
  </div>
  <hr />

  <div class="col-lg-6 col-12">
    <input-select inputLabel="Select User Type" (onSelectionChange)="FilterValue()" placeholder="---Select User Type---" [(selectedValue)]="UserTypeId" [isRequired]="true" [isSearch]="true" [masterList]="UserType"> </input-select>
  </div>

  <div class="col-12 p-3 w-100 mb-2">
    <div class="mat-elevation-z8">
      <div class="--table-container">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container [matColumnDef]="item.columnKey" *ngFor="let item of defaultTableColumns">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ item.headingName }}</th>
            <td mat-cell *matCellDef="let row">
              <dynamic-mat-columns *ngIf="row" [row]="row" [item]="item"></dynamic-mat-columns>
            </td>
          </ng-container>

          <ng-container matColumnDef="Action">
            <th mat-header-cell *matHeaderCellDef>
              <mat-icon class="NewBtnMatAdd" *ngIf="_GlobalService.rightsControl.canAdd" data-toggle="modal" data-backdrop="static" data-keyboard="false" data-target="#ListData" matTooltip="Add" matTooltipClass="matTooltip" (click)="Add()">add </mat-icon>
            </th>
            <td mat-cell *matCellDef="let row">
              <mat-icon class="BtnMatEditGreen" *ngIf="_GlobalService.rightsControl.canView || _GlobalService.rightsControl.canEdit" data-toggle="modal" data-backdrop="static" data-keyboard="false" data-target="#ListData" matTooltip="View or Edit" matTooltipClass="matTooltip" (click)="View(row)">visibility </mat-icon>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
      <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
    </div>
  </div>

  <div class="col-12">
    <button type="button" matRipple class="--btn-outlined-green">Save</button>
  </div>
</div>
