<h1 mat-dialog-title class="--primary-heading --mat-dialog">Tidal Data {{ !IsEdit ? "Entry" : "Update" }}</h1>

<div mat-dialog-content>
  <div class="row">
    <div class="col-12 mb-2" *ngIf="IsEdit">
      <!-- <div class="--input-group">
        <input InputField autocomplete="off" type="text" [(ngModel)]="TidalDataID" [disabled]="true" />
        <label Asterisk>Tidal DataID</label>
      </div> -->
    </div>

    <div class="col-12 mb-2">
      <input-select inputLabel="Select Location" placeholder="---Select Location---"
        [(selectedValue)]="ReadingLocationID" [isRequired]="true" [isSearch]="false" [masterList]="LocationList">
      </input-select>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="date" max="9999-12-31" [(ngModel)]="TDate" onkeydown="return true"
          [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Date</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" type="time" [(ngModel)]="TTime" onkeydown="return true"
          [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Time</label>
      </div>
    </div>

    <div class="col-12 mb-2">
      <input-select inputLabel="Select Type" [(selectedValue)]="TType" [isRequired]="true" [isSearch]="false"
        [masterList]="TypeList"> </input-select>
    </div>

    <div class="col-12 mb-2">
      <div class="--input-group">
        <input InputField autocomplete="off" min="0" type="number" [(ngModel)]="Height"
          [disabled]="!_GlobalService.rightsControl.canEdit && IsEdit" />
        <label Asterisk>Height (mtr)</label>
      </div>
    </div>
  </div>
</div>

<mat-dialog-actions align="end">
  <button type="button" matRipple class="--btn-outlined-gray m-1" [mat-dialog-close]="false">Close</button>
  <ng-container *ngIf="_GlobalService.rightsControl.canEdit || !IsEdit">
    <button type="button" matRipple class="--btn-outlined-green m-1" (click)="Submit()">{{ !IsEdit ? "Submit" : "Update"
      }}</button>
  </ng-container>
</mat-dialog-actions>
